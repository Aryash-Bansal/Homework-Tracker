<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
    font-family: Arial;
    background: #f4f6f9;
    margin: 0;
    padding: 20px;
}

button, select, input {
    cursor: pointer;
}

#welcomeScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 80vh;
}

#trackerScreen { display: none; }

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#userInfo {
    font-size: 12px;
    text-transform: none;
}

.icon-btn {
    background: #4CAF50;
    border: none;
    color: white;
    border-radius: 50%;
    width: 38px;
    height: 38px;
}

.form-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
}

input, select {
    width: 90%;
    max-width: 400px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #ddd;
}

.extra-field {
    width: 90%;
    max-width: 400px;
}

.hw-card {
    background: white;
    margin: 15px auto;
    width: 90%;
    max-width: 600px;
    padding: 12px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.strip {
    width: 6px;
    height: 100%;
    border-radius: 10px;
}

.hw-info {
    flex: 1;
}

.done {
    opacity: 0.5;
}

.progress {
    width: 90%;
    max-width: 400px;
    height: 10px;
    background: #ddd;
    border-radius: 20px;
    margin: 10px auto;
}

.progress-bar {
    height: 100%;
    background: #4CAF50;
    width: 0%;
}

.progress-text {
    text-align: center;
    font-size: 13px;
}
</style>
</head>

<body>

<div id="welcomeScreen">
<h1>Homework Tracker</h1>
<button id="loginBtn">Sign in with Google</button>
</div>

<div id="trackerScreen">

<div class="header">
<div id="userInfo"></div>
<button id="logoutBtn" class="icon-btn">⎋</button>
</div>

<h1>Homework Tracker</h1>

<div class="form-container">

<select id="hwType">
<option value="">Type of Homework</option>
<option>TB Exercises</option>
<option>QnAs</option>
<option>Make Notes</option>
<option>Reading</option>
<option>Project</option>
</select>

<select id="subject">
<option value="">Subject</option>
<option>English</option>
<option>History/Civics</option>
<option>Geography</option>
<option>Maths</option>
<option>Computer</option>
<option>Biology</option>
<option>Chemistry</option>
<option>Physics</option>
<option>Hindi</option>
<option>Kannada</option>
<option>French</option>
</select>

<div id="extraField"></div>

<input type="date" id="dateInput">

</div>

<div class="progress-text" id="progressText"></div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>

<button onclick="addHomework()">+</button>

<div id="homeworkList"></div>

</div>

<script type="module">
import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
signOut,
onAuthStateChanged,
setPersistence,
browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
query,
where
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const app = initializeApp({
apiKey:"AIzaSyBvxAsbhzV_XwEkmPTBNSchgapkSU2NFUI",
authDomain:"homework-tracker-global.firebaseapp.com",
projectId:"homework-tracker-global"
});

const auth=getAuth(app);
const db=getFirestore(app);
const provider=new GoogleAuthProvider();

await setPersistence(auth,browserLocalPersistence);

let hwData=[];

document.getElementById("loginBtn").onclick=()=>signInWithPopup(auth,provider);
document.getElementById("logoutBtn").onclick=()=>signOut(auth);

document.getElementById("subject").onchange=()=>{
const val=subject.value;
const box=document.getElementById("extraField");

if(val==="QnAs"){
box.innerHTML=`<input id="qCount" placeholder="Number of questions">`;
}
else if(val==="Maths"){
box.innerHTML=`<input id="mCount" placeholder="Number of exercises">`;
}
else{
box.innerHTML="";
}
};

window.addHomework=async()=>{
const u=auth.currentUser;
if(!u)return;

await addDoc(collection(db,"homework"),{
uid:u.uid,
type:hwType.value,
subject:subject.value,
date:dateInput.value,
done:false,
createdAt:Date.now()
});

load();
};

function getColor(days){
if(days<0)return"red";
if(days<=2)return"yellow";
return"green";
}

async function load(){
const u=auth.currentUser;
if(!u)return;

const q=query(collection(db,"homework"),where("uid","==",u.uid));
const snap=await getDocs(q);

hwData=[];
snap.forEach(d=>hwData.push({id:d.id,...d.data()}));

render();
}

function render(){
const list=document.getElementById("homeworkList");
list.innerHTML="";

let done=0;

hwData.sort((a,b)=>a.done-b.done);

hwData.forEach(h=>{

const days=Math.ceil((new Date(h.date)-new Date())/86400000);

if(h.done)done++;

const card=document.createElement("div");
card.className="hw-card"+(h.done?" done":"");

card.innerHTML=`
<div class="strip" style="background:${getColor(days)}"></div>

<div class="hw-info">
<b>${h.subject} - ${h.type}</b><br>
<small>${days>=0?days+" days left":"Overdue"}</small>
</div>

<div>
${h.done?"✖":`<button onclick="markDone('${h.id}')">Done</button>`}
</div>
`;

list.appendChild(card);
});

let total=hwData.length;
let pct=total?Math.round((done/total)*100):0;

progressBar.style.width=pct+"%";

if(total===0){
progressText.textContent="This bar shows ur hw progress";
}
else if(done===0){
progressText.textContent="Finish hw to increase ur progress";
}
else{
progressText.textContent=pct+"% completed";
}

if(pct===100 && total>1){
confetti();
const msg=document.createElement("h2");
msg.textContent="ALL DONE!";
msg.style.textAlign="center";
document.getElementById("homeworkList").prepend(msg);
}
}

window.markDone=(id)=>{
const item=hwData.find(h=>h.id===id);
if(item)item.done=true;
render();
};

onAuthStateChanged(auth,u=>{
if(u){
welcomeScreen.style.display="none";
trackerScreen.style.display="block";
userInfo.textContent="currently signed in as "+u.displayName;
load();
}
});
</script>

</body>
</html>
