<!DOCTYPE html>
<html>
<head>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Homework Tracker v2</title> <!-- 👈 VERSION TAG -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial;
    background: #f4f6f9;
    margin: 0;
}

/* BIG OBVIOUS CHANGE */
body::before {
    content: "NEW UI LOADED ✅";
    display: block;
    background: black;
    color: white;
    padding: 5px;
    text-align: center;
}

/* layout */
#trackerScreen {
    display: none;
    max-width: 600px;
    margin: auto;
    padding: 40px 20px;
}

h1 {
    font-size: 32px;
    text-align: left;
}

.form-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

input, select {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
}

/* floating button */
.plus-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    font-size: 28px;
    border-radius: 50%;
    background: green;
    color: white;
}
</style>

</head>

<body>

<div id="welcomeScreen">
    <h1>Homework Tracker</h1>
    <button id="loginBtn">Login</button>
</div>

<div id="trackerScreen">
    <h1>Homework Tracker</h1>

    <div class="form-container">
        <select id="hwType">
            <option>Test</option>
        </select>

        <input type="date" id="dateInput">
    </div>

    <button class="plus-btn">+</button>
</div>

<script>
document.getElementById("loginBtn").onclick = () => {
    document.getElementById("welcomeScreen").style.display="none";
    document.getElementById("trackerScreen").style.display="block";
};
</script>

</body>
</html>
