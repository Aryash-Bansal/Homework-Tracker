<!DOCTYPE html>
<html>
<head>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Homework Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial;
    background: #f4f6f9;
    margin: 0;
}

/* LOGIN */
#welcomeScreen {
    text-align: center;
    margin-top: 120px;
}

#loginBtn {
    padding: 14px 35px;
    font-size: 18px;
    background: #4285F4;
    color: white;
    border: none;
    border-radius: 12px;
}

/* APP */
#trackerScreen {
    display: none;
    max-width: 650px;
    margin: auto;
    padding: 40px 20px 100px;
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#userInfo {
    font-size: 14px;
    color: #666;
}

#logoutBtn {
    background: none;
    border: none;
    color: #888;
    cursor: pointer;
}

/* TITLE FIXED */
h1 {
    font-size: 32px;
    margin: 20px 0 30px;
    text-align: center;
}

/* FORM */
.form-container {
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-bottom: 30px; /* spacing before list */
}

.field label {
    font-size: 13px;
    color: #666;
    display: block;
    margin-bottom: 6px;
}

input, select {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: 1px solid #ddd;
    background: white;
    box-sizing: border-box;
}

/* FORCE DATE SAME STYLE */
input[type="date"] {
    appearance: none;
    -webkit-appearance: none;
    position: relative;
}

/* FLOAT BUTTON */
.plus-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    font-size: 28px;
    border-radius: 50%;
    background: #4CAF50;
    color: white;
    border: none;
    cursor: pointer;
}

/* LIST */
.homework {
    background: white;
    padding: 15px;
    margin-top: 14px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
}

.green { border-left: 5px solid green; }
.yellow { border-left: 5px solid orange; }
.red { border-left: 5px solid red; }

.due-text {
    font-size: 13px;
    color: #666;
    margin-top: 5px;
}

/* EMPTY */
.empty {
    text-align: center;
    margin-top: 40px;
    color: #888;
}
</style>
</head>

<body>

<div id="welcomeScreen">
    <h1>Homework Tracker</h1>
    <p>All your homework in one place</p>
    <button id="loginBtn">Sign in with Google</button>
</div>

<div id="trackerScreen">

    <div class="header">
        <span id="userInfo"></span>
        <button id="logoutBtn">Logout</button>
    </div>

    <h1>Homework Tracker</h1>

    <div class="form-container">

        <div class="field">
            <label>Type of Homework</label>
            <select id="hwType" onchange="checkType()">
                <option value="">Select</option>
                <option>TB Exercises</option>
                <option>QnAs</option>
                <option>Make Notes</option>
                <option>Reading</option>
                <option>Project</option>
            </select>
        </div>

        <div class="field" id="qnaWrap" style="display:none;">
            <label>Number of Questions</label>
            <input id="qnaBox">
        </div>

        <div class="field">
            <label>Subject</label>
            <select id="subject">
                <option value="">Select</option>
                <option>English</option>
                <option>History/Civics</option>
                <option>Geography</option>
                <option>Maths</option>
                <option>Computer</option>
                <option>Biology</option>
                <option>Chemistry</option>
                <option>Physics</option>
                <option>Hindi</option>
                <option>Kannada</option>
                <option>French</option>
            </select>
        </div>

        <div class="field">
            <label>Due Date</label>
            <input type="date" id="dateInput" onclick="this.showPicker()">
        </div>

    </div>

    <button class="plus-btn" onclick="addHomework()">+</button>

    <div id="homeworkList"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, query, where, orderBy }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBvxAsbhzV_XwEkmPTBNSchgapkSU2NFUI",
  authDomain: "homework-tracker-global.firebaseapp.com",
  projectId: "homework-tracker-global",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let homeworkList = [];

loginBtn.onclick = () => signInWithPopup(auth,provider);
logoutBtn.onclick = () => signOut(auth);

onAuthStateChanged(auth, async (user)=>{
    if(user){
        currentUser=user;
        welcomeScreen.style.display="none";
        trackerScreen.style.display="block";
        userInfo.textContent="Logged in as: "+user.displayName;
        loadHomework();
    }
});

window.checkType = ()=>{
    qnaWrap.style.display = hwType.value==="QnAs"?"block":"none";
};

window.addHomework = async ()=>{
    if(!hwType.value||!subject.value||!dateInput.value) return;

    await addDoc(collection(db,"homework"),{
        uid: currentUser.uid,
        type: hwType.value,
        subject: subject.value,
        date: dateInput.value,
        qna: qnaBox.value,
        completed:false,
        createdAt: Date.now()
    });

    hwType.value="";
    subject.value="";
    dateInput.value="";
    qnaBox.value="";
    qnaWrap.style.display="none";

    loadHomework();
};

async function loadHomework(){
    const q = query(
        collection(db,"homework"),
        where("uid","==",currentUser.uid),
        orderBy("createdAt","desc")
    );

    const snap = await getDocs(q);
    homeworkList=[];
    snap.forEach(d=>homeworkList.push({id:d.id,...d.data()}));

    renderHomework();
}

window.deleteHomework = async id=>{
    await deleteDoc(doc(db,"homework",id));
    loadHomework();
};

window.toggleComplete = async (id,current)=>{
    await updateDoc(doc(db,"homework",id),{completed:!current});
    loadHomework();
};

function renderHomework(){
    const list=document.getElementById("homeworkList");
    list.innerHTML="";

    if(homeworkList.length===0){
        list.innerHTML='<div class="empty">No homework yet</div>';
        return;
    }

    const today=new Date(); today.setHours(0,0,0,0);

    homeworkList.forEach(hw=>{
        const div=document.createElement("div");

        const due=new Date(hw.date);
        due.setHours(0,0,0,0);

        const diff=Math.ceil((due-today)/(1000*60*60*24));

        let status="green";
        if(diff<0) status="red";
        else if(diff<=2) status="yellow";

        div.className=`homework ${status}`;
        div.innerHTML=`
            <div>
                <strong>${hw.subject}</strong> - ${hw.type}
                ${hw.qna?` (${hw.qna})`:""}
                <div class="due-text">
                    ${diff>0?diff+" days left":diff===0?"Due today":"Overdue"}
                </div>
            </div>
            <div>
                <button onclick="toggleComplete('${hw.id}',${hw.completed})">${hw.completed?"Undo":"Done"}</button>
                <button onclick="deleteHomework('${hw.id}')">❌</button>
            </div>
        `;

        list.appendChild(div);
    });
}
</script>

</body>
</html>
