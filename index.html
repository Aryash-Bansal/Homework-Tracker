<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 20px;
}

h1 { text-align: center; }

#welcomeScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 80vh;
}

#loginBtn {
    padding: 12px 28px;
    border-radius: 12px;
    border: none;
    background: #4285F4;
    color: white;
    cursor: pointer;
}

#trackerScreen { display: none; }

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#logoutBtn {
    padding: 6px 12px;
    border-radius: 8px;
    border: none;
    background: #4CAF50;
    color: white;
    cursor: pointer;
}

.form-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
}

input, select {
    width: 90%;
    max-width: 400px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #ddd;
}

.plus-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #4CAF50;
    color: white;
    font-size: 28px;
    border: none;
    cursor: pointer;
}

.homework {
    background: white;
    padding: 15px;
    margin: 12px auto;
    width: 90%;
    max-width: 600px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.progress {
    width: 90%;
    max-width: 400px;
    height: 10px;
    background: #ddd;
    border-radius: 20px;
    margin: 10px auto;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #4CAF50;
    border-radius: 20px;
}

.progress-text {
    text-align: center;
    font-size: 13px;
}
</style>
</head>

<body>

<div id="welcomeScreen">
<h1>Homework Tracker</h1>
<button id="loginBtn">Sign in with Google</button>
</div>

<div id="trackerScreen">

<div class="header">
<div id="userInfo"></div>
<button id="logoutBtn">Logout</button>
</div>

<h1>Homework Tracker</h1>

<div class="form-container">

<select id="hwType">
<option value="">Type of Homework</option>
<option>TB Exercises</option>
<option>QnAs</option>
<option>Make Notes</option>
<option>Reading</option>
<option>Project</option>
</select>

<select id="subject">
<option value="">Subject</option>
<option>English</option>
<option>History/Civics</option>
<option>Geography</option>
<option>Maths</option>
<option>Computer</option>
<option>Biology</option>
<option>Chemistry</option>
<option>Physics</option>
<option>Hindi</option>
<option>Kannada</option>
<option>French</option>
</select>

<input type="date" id="dateInput">

</div>

<div class="progress-text" id="progressText"></div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>

<button class="plus-btn" id="addBtn">+</button>

<div id="homeworkList"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import {
getAuth,
GoogleAuthProvider,
signInWithRedirect,
getRedirectResult,
signOut,
onAuthStateChanged,
setPersistence,
browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
query,
where
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

/* FIREBASE INIT */
const app = initializeApp({
apiKey: "AIzaSyBvxAsbhzV_XwEkmPTBNSchgapkSU2NFUI",
authDomain: "homework-tracker-global.firebaseapp.com",
projectId: "homework-tracker-global"
});

const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

await setPersistence(auth, browserLocalPersistence);

/* UI ELEMENTS */
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

/* STATE LOCK (IMPORTANT FIX) */
let authResolved = false;

/* STEP 1: HANDLE REDIRECT RESULT FIRST */
try {
const result = await getRedirectResult(auth);
console.log("Redirect result:", result);
} catch (e) {
console.error(e);
}

/* STEP 2: LOGIN */
loginBtn.onclick = () => {
signInWithRedirect(auth, provider);
};

/* STEP 3: LOGOUT */
logoutBtn.onclick = () => {
signOut(auth);
};

/* STEP 4: WAIT FOR AUTH BEFORE UI DECISION */
onAuthStateChanged(auth, (user) => {

authResolved = true;

const welcome = document.getElementById("welcomeScreen");
const tracker = document.getElementById("trackerScreen");
const info = document.getElementById("userInfo");

if (user) {
welcome.style.display = "none";
tracker.style.display = "block";
info.textContent = "Currently signed in as " + user.displayName;
load();
} else {
welcome.style.display = "flex";
tracker.style.display = "none";
}
});
</script>

</body>
</html>
