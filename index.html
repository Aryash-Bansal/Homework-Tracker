<!DOCTYPE html>
<html>
<head>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4CAF50">

<title>Homework Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 20px;
}

#welcomeScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 80vh;
}

#loginBtn {
    padding: 12px 28px;
    border-radius: 12px;
    border: none;
    background: #4285F4;
    color: white;
}

#trackerScreen { display: none; }

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#userInfo {
    font-size: 12px;
}

.icon-btn {
    background: #4CAF50;
    border: none;
    color: white;
    border-radius: 50%;
    width: 38px;
    height: 38px;
}

h1 { text-align: center; }

.form-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
}

input, select {
    width: 90%;
    max-width: 400px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #ddd;
}

.extra-field {
    width: 90%;
    max-width: 400px;
}

.plus-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #4CAF50;
    color: white;
    font-size: 28px;
    border: none;
}

.homework {
    background: white;
    padding: 15px;
    margin: 12px auto;
    width: 90%;
    max-width: 600px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    position: relative;
    opacity: 1;
}

.homework.done {
    opacity: 0.5;
    text-decoration: line-through;
}

.left-bar {
    width: 6px;
    border-radius: 6px;
    margin-right: 10px;
}

.hw-content {
    display: flex;
    flex-direction: column;
    flex: 1;
}

.small {
    font-size: 12px;
    color: gray;
}

.bottom {
    margin-top: 15px;
}

.progress {
    width: 90%;
    max-width: 400px;
    height: 10px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
    margin: 10px auto;
}

.progress-bar {
    height: 100%;
    background: #4CAF50;
    width: 0%;
}

.progress-text {
    text-align: center;
    font-size: 13px;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<div id="welcomeScreen">
    <h1>Homework Tracker</h1>
    <button id="loginBtn">Sign in with Google</button>
</div>

<div id="trackerScreen">

<div class="header">
<span id="userInfo"></span>
<button id="logoutBtn" class="icon-btn">⎋</button>
</div>

<h1>Homework Tracker</h1>

<div class="form-container">

<select id="hwType">
<option value="">Type of Homework</option>
<option>TB Exercises</option>
<option>QnAs</option>
<option>Make Notes</option>
<option>Reading</option>
<option>Project</option>
</select>

<select id="subject">
<option value="">Subject</option>
<option>English</option>
<option>History/Civics</option>
<option>Geography</option>
<option>Maths</option>
<option>Computer</option>
<option>Biology</option>
<option>Chemistry</option>
<option>Physics</option>
<option>Hindi</option>
<option>Kannada</option>
<option>French</option>
</select>

<div id="dynamicFields"></div>

<input type="date" id="dateInput">

</div>

<div class="progress-text" id="progressText">This bar shows ur hw progress</div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>

<button class="plus-btn" onclick="addHomework()">+</button>

<div id="homeworkList" class="bottom"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import {
getAuth, GoogleAuthProvider, signInWithPopup,
signOut, onAuthStateChanged, setPersistence,
browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

import {
getFirestore, collection, addDoc,
getDocs, query, where, orderBy
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const app = initializeApp({
apiKey: "AIzaSyBvxAsbhzV_XwEkmPTBNSchgapkSU2NFUI",
authDomain: "homework-tracker-global.firebaseapp.com",
projectId: "homework-tracker-global"
});

const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

await setPersistence(auth, browserLocalPersistence);

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const userInfo = document.getElementById("userInfo");

loginBtn.onclick = () => signInWithPopup(auth, provider);
logoutBtn.onclick = () => signOut(auth);

let homeworkList = [];

document.getElementById("subject").onchange = () => {
const sub = subject.value;
const div = document.getElementById("dynamicFields");
div.innerHTML = "";

if (sub === "Maths") {
document.getElementById("hwType").innerHTML += `<option>Maths Exercises</option>`;
div.innerHTML += `<input id="mathCount" class="extra-field" placeholder="Number of exercises">`;
}
};

document.getElementById("hwType").onchange = () => {
const div = document.getElementById("dynamicFields");
if (hwType.value === "QnAs") {
div.innerHTML = `<input id="qnaCount" class="extra-field" placeholder="Number of questions">`;
}
};

window.addHomework = async () => {
const user = auth.currentUser;
if (!user) return;

await addDoc(collection(db,"homework"),{
uid:user.uid,
type:hwType.value,
subject:subject.value,
date:dateInput.value,
createdAt:Date.now(),
completed:false
});

loadHomework();
};

function getStatusColor(days){
if(days<0) return "red";
if(days<=2) return "yellow";
return "green";
}

async function loadHomework(){
const user = auth.currentUser;
if(!user) return;

const q=query(collection(db,"homework"),where("uid","==",user.uid));
const snap=await getDocs(q);

homeworkList=[];
snap.forEach(d=>homeworkList.push({id:d.id,...d.data()}));

render();
}

function render(){
const list=document.getElementById("homeworkList");
list.innerHTML="";

homeworkList.sort((a,b)=>a.completed-b.completed);

let done=0;

homeworkList.forEach(hw=>{
const days=Math.ceil((new Date(hw.date)-new Date())/(1000*60*60*24));
if(hw.completed) done++;

const div=document.createElement("div");
div.className="homework"+(hw.completed?" done":"");

div.innerHTML=`
<div class="left-bar" style="background:${getStatusColor(days)}"></div>
<div class="hw-content">
<b>${hw.subject} - ${hw.type}</b>
<span class="small">${hw.date}</span>
</div>
<div>
${hw.completed ? "✖" : `<button onclick="markDone('${hw.id}')">Done</button>`}
</div>
`;

list.appendChild(div);
});

// progress
let total=homeworkList.length;

let percent = total?Math.round((done/total)*100):0;

if(total===0){
progressText.textContent="This bar shows ur hw progress";
progressBar.style.width="0%";
}
else if(done===0){
progressText.textContent="Finish hw to increase ur progress";
progressBar.style.width="0%";
}
else{
progressText.textContent=percent+"% completed";
progressBar.style.width=percent+"%";
}

if(percent===100 && total>1){
confetti();
document.body.insertAdjacentHTML("afterbegin","<h2 style='text-align:center'>ALL DONE!</h2>");
}
}

window.markDone=(id)=>{
homeworkList.forEach(h=>{if(h.id===id)h.completed=true});
render();
};

onAuthStateChanged(auth,u=>{
if(u){
welcomeScreen.style.display="none";
trackerScreen.style.display="block";
userInfo.textContent="currently signed in as "+u.displayName;
loadHomework();
}
});
</script>

</body>
</html>
