<!DOCTYPE html>
<html>
<head>
<meta name="mobile-web-app-capable" content="yes">
<title>Homework Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
    font-family: Arial;
    background: #f4f6f9;
    margin: 0;
}

/* CONTAINER */
#trackerScreen {
    max-width: 650px;
    margin: auto;
    padding: 40px 20px 120px;
}

/* TITLE */
h1 {
    text-align: center;
    margin-bottom: 25px;
}

/* FORM */
.form-container {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 25px;
}

input, select {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #ddd;
}

/* FLOAT BUTTON */
.plus-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    font-size: 28px;
    border-radius: 50%;
    background: #4CAF50;
    color: white;
    border: none;
}

/* PROGRESS */
.progress-container {
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 18px;
    width: 0%;
    background: #4CAF50;
    transition: width 0.4s ease;
}

.progress-text {
    text-align: center;
    font-size: 14px;
    margin: 10px 0 20px;
}

/* LIST */
.homework {
    background: white;
    padding: 15px;
    margin-top: 12px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.25s ease;
}

.completed {
    opacity: 0.5;
}

.green { border-left: 5px solid green; }
.yellow { border-left: 5px solid orange; }
.red { border-left: 5px solid red; }

/* POP */
.pop {
    animation: pop 0.2s ease forwards;
}

@keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(0); opacity: 0; }
}

.empty {
    text-align: center;
    color: #888;
    margin-top: 40px;
}
</style>
</head>

<body>

<div id="trackerScreen">

<h1>Homework Tracker</h1>

<div class="form-container">
<select id="hwType">
<option value="">Type of Homework</option>
<option>TB Exercises</option>
<option>QnAs</option>
<option>Make Notes</option>
<option>Reading</option>
<option>Project</option>
</select>

<select id="subject">
<option value="">Subject</option>
<option>Maths</option>
<option>Science</option>
<option>English</option>
</select>

<input type="date" id="dateInput" onclick="this.showPicker()">
</div>

<button class="plus-btn" onclick="addHomework()">+</button>

<div class="progress-container">
<div class="progress-bar" id="progressBar"></div>
</div>
<div class="progress-text" id="progressText"></div>

<div id="homeworkList"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, query, where, orderBy }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "homework-tracker-global.firebaseapp.com",
  projectId: "homework-tracker-global",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

let currentUser=null;
let homeworkList=[];

signInWithPopup(auth,provider);

onAuthStateChanged(auth,(user)=>{
    if(user){
        currentUser=user;
        loadHomework();
    }
});

window.addHomework = async ()=>{
    if(!hwType.value||!subject.value||!dateInput.value) return;

    await addDoc(collection(db,"homework"),{
        uid: currentUser.uid,
        type: hwType.value,
        subject: subject.value,
        date: dateInput.value,
        completed:false,
        createdAt: Date.now()
    });

    hwType.value="";
    subject.value="";
    dateInput.value="";
    loadHomework();
};

async function loadHomework(){
    const q = query(
        collection(db,"homework"),
        where("uid","==",currentUser.uid),
        orderBy("createdAt","desc")
    );

    const snap = await getDocs(q);
    homeworkList=[];
    snap.forEach(d=>homeworkList.push({id:d.id,...d.data()}));

    renderHomework();
}

window.completeWithPop = async (btn,id)=>{
    const card = btn.closest(".homework");
    card.classList.add("pop");

    setTimeout(async ()=>{
        await updateDoc(doc(db,"homework",id),{completed:true});
        loadHomework();
    },200);
};

window.deleteHomework = async (id)=>{
    await deleteDoc(doc(db,"homework",id));
    loadHomework();
};

function renderHomework(){
    const list=document.getElementById("homeworkList");
    list.innerHTML="";

    if(homeworkList.length===0){
        list.innerHTML='<div class="empty">Add homework to get started</div>';
        updateProgress();
        return;
    }

    // sort properly
    homeworkList.sort((a,b)=>a.completed - b.completed);

    const today=new Date(); today.setHours(0,0,0,0);

    homeworkList.forEach(hw=>{
        const div=document.createElement("div");

        const due=new Date(hw.date);
        due.setHours(0,0,0,0);

        const diff=Math.ceil((due-today)/(1000*60*60*24));

        let status="green";
        if(diff<0) status="red";
        else if(diff<=2) status="yellow";

        div.className=`homework ${status} ${hw.completed?"completed":""}`;

        div.innerHTML=`
        <div>
            <strong>${hw.subject}</strong> - ${hw.type}
        </div>
        <div>
            ${
                hw.completed
                ? `<button onclick="deleteHomework('${hw.id}')">❌</button>`
                : `<button onclick="completeWithPop(this,'${hw.id}')">Done</button>`
            }
        </div>
        `;

        list.appendChild(div);
    });

    updateProgress();
}

function updateProgress(){
    const total = homeworkList.length;
    const done = homeworkList.filter(h=>h.completed).length;

    const percent = total===0?0:Math.round((done/total)*100);
    progressBar.style.width = percent+"%";

    if(total===0){
        progressText.innerText="Add HW to see completion";
    } else if(done===0){
        progressText.innerText="Click done to progress";
    } else {
        progressText.innerText = percent + "% complete";
    }

    if(total>0 && done===total){
        progressText.innerText="ALL DONE 🎉";
        confetti({ particleCount:150, spread:70 });
    }
}
</script>

</body>
</html>
