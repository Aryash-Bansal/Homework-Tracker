<!DOCTYPE html>
<html>
<head>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4CAF50">

<title>Homework Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 20px;
}

#welcomeScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 80vh;
}

#loginBtn {
    padding: 12px 28px;
    border-radius: 12px;
    border: none;
    background: #4285F4;
    color: white;
}

#trackerScreen { display: none; }

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

h1 { text-align: center; }

.form-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
}

input, select {
    width: 90%;
    max-width: 400px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #ddd;
}

.plus-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #4CAF50;
    color: white;
    font-size: 28px;
    border: none;
}

.homework {
    background: white;
    padding: 15px;
    margin: 10px auto;
    width: 90%;
    max-width: 600px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
}
</style>
</head>

<body>

<div id="welcomeScreen">
    <h1>Homework Tracker</h1>
    <button id="loginBtn">Sign in with Google</button>
</div>

<div id="trackerScreen">
<div class="header">
<span id="userInfo"></span>
<button id="logoutBtn">Logout</button>
</div>

<h1>Homework Tracker</h1>

<div class="form-container">
<select id="hwType">
<option value="">Type of Homework</option>
<option>TB Exercises</option>
<option>QnAs</option>
<option>Make Notes</option>
<option>Reading</option>
<option>Project</option>
</select>

<select id="subject">
<option value="">Subject</option>
<option>English</option>
<option>History/Civics</option>
<option>Geography</option>
<option>Maths</option>
<option>Computer</option>
<option>Biology</option>
<option>Chemistry</option>
<option>Physics</option>
<option>Hindi</option>
<option>Kannada</option>
<option>French</option>
</select>

<input type="date" id="dateInput" onclick="this.showPicker()">
</div>

<button class="plus-btn" onclick="addHomework()">+</button>

<div id="homeworkList"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithRedirect,
  signOut,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence,
  getRedirectResult
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  where,
  orderBy
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBvxAsbhzV_XwEkmPTBNSchgapkSU2NFUI",
  authDomain: "homework-tracker-global.firebaseapp.com",
  projectId: "homework-tracker-global",
  storageBucket: "homework-tracker-global.appspot.com",
  messagingSenderId: "801681205060",
  appId: "1:801681205060:web:bbaa8fadd867a32edf9911"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

/* 🔥 FIX: persistence + redirect recovery */
await setPersistence(auth, browserLocalPersistence);
await getRedirectResult(auth);

/* ELEMENTS */
const welcomeScreen = document.getElementById("welcomeScreen");
const trackerScreen = document.getElementById("trackerScreen");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const userInfo = document.getElementById("userInfo");

/* LOGIN */
loginBtn.onclick = () => signInWithRedirect(auth, provider);
logoutBtn.onclick = () => signOut(auth);

/* AUTH LISTENER */
onAuthStateChanged(auth, async (user) => {
    console.log("Auth state:", user);

    if (user) {
        welcomeScreen.style.display = "none";
        trackerScreen.style.display = "block";
        userInfo.textContent = "Logged in as: " + user.displayName;

        await loadHomework();
    } else {
        welcomeScreen.style.display = "flex";
        trackerScreen.style.display = "none";
    }
});

/* HOMEWORK */
window.addHomework = async () => {
    if (!hwType.value || !subject.value || !dateInput.value) return;

    await addDoc(collection(db, "homework"), {
        uid: auth.currentUser.uid,
        type: hwType.value,
        subject: subject.value,
        date: dateInput.value,
        completed: false,
        createdAt: Date.now()
    });

    loadHomework();
};

let homeworkList = [];

async function loadHomework() {
    const q = query(
        collection(db, "homework"),
        where("uid", "==", auth.currentUser.uid),
        orderBy("createdAt", "desc")
    );

    const snap = await getDocs(q);
    homeworkList = [];
    snap.forEach(d => homeworkList.push({ id: d.id, ...d.data() }));

    renderHomework();
}

function renderHomework() {
    const list = document.getElementById("homeworkList");
    list.innerHTML = "";
    homeworkList.forEach(hw => {
        const div = document.createElement("div");
        div.className = "homework";
        div.innerHTML = `${hw.subject} - ${hw.type}`;
        list.appendChild(div);
    });
}
</script>

</body>
</html>
