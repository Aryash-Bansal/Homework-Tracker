<!DOCTYPE html>
<html>
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <title>Homework Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; text-align: center; padding: 20px; margin: 0; transition: background 1s ease; }
        #welcomeScreen { margin-top: 60px; }
        #welcomeScreen h1 { font-size: 48px; margin-bottom: 10px; color: #333; }
        #welcomeScreen h2 { font-size: 24px; margin-bottom: 5px; color: #555; }
        #welcomeScreen h3 { font-size: 16px; margin-bottom: 30px; color: #888; }
        #loginBtn { padding: 14px 35px; font-size: 18px; background: #4285F4; color: white; border: none; border-radius: 10px; cursor: pointer; }
        #logoutBtn {
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
    border: none;
    border-radius: 999px;
    background: #4CAF50;
    color: white;
    font-weight: bold;
    transition: 0.2s ease;
}

#logoutBtn:hover {
    transform: scale(1.05);
    background: #43a047;
}

#logoutBtn:active {
    transform: scale(0.97);
}
        #trackerScreen { display: none; }
        h1 { margin-bottom: 15px; }

        .form-container { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 20px; }
        input, select { padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; width: 100%; max-width: 250px; box-sizing: border-box; }
        .plus-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    font-size: 22px;
    background: #4CAF50;
    color: white;
    cursor: pointer;
    transition: 0.2s ease;
}

.plus-btn:hover {
    transform: scale(1.08);
    background: #43a047;
}

.plus-btn:active {
    transform: scale(0.95);
}

        .homework { background: white; padding: 14px; margin: 10px auto; width: 95%; max-width: 650px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .green { border-left: 6px solid green; }
        .yellow { border-left: 6px solid orange; }
        .red { border-left: 6px solid red; }
        .due-text { font-size: 14px; margin-top: 4px; }
        .actions { display: flex; gap: 8px; }

        .progress-container { width: 95%; max-width: 650px; background: #ddd; margin: 20px auto; border-radius: 20px; overflow: hidden; }
        .progress-bar { height: 20px; width: 0%; background: #4CAF50; transition: width 0.4s ease; }
        #allDone { font-size: 40px; font-weight: bold; color: green; display: none; margin-top: 20px; }

      .small-btn {
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
    border: none;
    border-radius: 999px;
    background: #4CAF50;
    color: white;
    font-weight: bold;
    transition: 0.2s ease;
}

.small-btn:hover {
    transform: scale(1.05);
    background: #43a047;
}

.small-btn:active {
    transform: scale(0.97);
}
        /* Timer widget */
       #timerSection {
    width: 95%;
    max-width: 650px;
    margin: 12px auto;
    background: white;
    padding: 10px;
    border-radius: 10px;
}
        .timer {
    margin: 10px auto;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    width: fit-content;
    min-width: 320px;
}

        @media (max-width: 600px) {
            #welcomeScreen h1 { font-size: 32px; }
            h1 { font-size: 26px; }
            .form-container { flex-direction: column; align-items: center; }
            .homework { flex-direction: column; align-items: flex-start; gap: 10px; }
            .actions { align-self: flex-end; }
            #allDone { font-size: 28px; }
        }
    </style>
</head>
<body>

<div id="welcomeScreen">
    <h1>Welcome to Homework Tracker!!!</h1>
    <h2>All your homework in one place</h2>
    <h3>Made by Aryash Bansal</h3>
    <button id="loginBtn">Sign in with Google</button>
</div>

<div id="trackerScreen">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; width:95%; max-width:650px; margin-left:auto; margin-right:auto;">
    <span id="userInfo"></span>
    <button id="logoutBtn">Logout</button>
</div>

    <h1>Homework Tracker</h1>

    <button class="small-btn" onclick="nextBackground()">Next Background 🎨</button>

    <div id="timerSection">
    <h3>Timers</h3>

    <input id="timerHours" type="number" placeholder="Hours" style="width:100px;">
<input id="timerMinutes" type="number" placeholder="Minutes" style="width:100px;">
<input id="timerSeconds" type="number" placeholder="Seconds" style="width:100px;">
        
    <button class="small-btn" onclick="addTimer()">Add Timer</button>
    <div id="timers"></div>
</div>
    <div class="form-container">
        <select id="hwType" onchange="checkType()">
            <option value="">Homework Type</option>
            <option>TB Exercises</option>
            <option>QnAs</option>
            <option>Make Notes</option>
            <option>Reading</option>
            <option>Project</option>
        </select>

        <input type="text" id="qnaBox" placeholder="Number of Questions" style="display:none;">

        <select id="subject">
            <option value="">Subject</option>
            <option>English</option>
            <option>History/Civics</option>
            <option>Geography</option>
            <option>Maths</option>
            <option>Computer</option>
            <option>Biology</option>
            <option>Chemistry</option>
            <option>Physics</option>
            <option>Hindi</option>
            <option>Kannada</option>
            <option>French</option>
        </select>

        <div>
            <label style="font-size:12px;">Submission Date</label><br>
            <input type="date" id="dateInput">
        </div>

        <button class="plus-btn" onclick="addHomework()">+</button>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="homeworkList"></div>
    <div id="allDone">ALL DONE 🎉</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, query, where, orderBy }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBvxAsbhzV_XwEkmPTBNSchgapkSU2NFUI",
  authDomain: "homework-tracker-global.firebaseapp.com",
  projectId: "homework-tracker-global",
  storageBucket: "homework-tracker-global.firebasestorage.app",
  messagingSenderId: "801681205060",
  appId: "1:801681205060:web:bbaa8fadd867a32edf9911"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser=null;
let homeworkList=[];

// Background rotation
const backgrounds = [
  "#f4f6f9",
  "#e3f2fd",
  "#fff3e0",
  "#f3e5f5",
  "#e8f5e9"
];
let bgIndex = 0;

function setBackground(){
  document.body.style.background = backgrounds[bgIndex];
}

window.nextBackground = function(){
  bgIndex = (bgIndex + 1) % backgrounds.length;
  setBackground();
};

setInterval(()=>{
  window.nextBackground();
}, 1800000); // 30 min

// Motivational popup
const quotes=[
"Keep going, you're doing great!",
"Small progress is still progress!",
"You got this!",
"Discipline beats motivation.",
"One task at a time!"
];

setInterval(()=>{
  const q = quotes[Math.floor(Math.random()*quotes.length)];
  alert("💡 " + q);
},1800000);

// ================= TIMER SYSTEM (UPGRADED) =================
// ================= TIMER SYSTEM (UPGRADED) =================

let alarmInterval = null;
let audioCtx = null;

function startAlarm() {
  if (alarmInterval) return;

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  alarmInterval = setInterval(() => {

    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    oscillator.type = "square";
    oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime);

    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.5);

  }, 700);
}

window.stopAlarm = function(id) {

  if (alarmInterval) {
    clearInterval(alarmInterval);
    alarmInterval = null;
  }

  if (audioCtx) {
    audioCtx.close();
    audioCtx = null;
  }

  // remove finished timer
  timers = timers.filter(t => t.id !== id);
}
let timers = [];

// ADD TIMER
window.addTimer = function () {

  const h = parseInt(document.getElementById("timerHours").value) || 0;
  const m = parseInt(document.getElementById("timerMinutes").value) || 0;
  const s = parseInt(document.getElementById("timerSeconds").value) || 0;

  const durationMs = (h * 3600 + m * 60 + s) * 1000;

  if (durationMs <= 0) return;

  const id = Date.now();

  timers.push({
    id,
    durationMs,
    remainingMs: durationMs,
    end: Date.now() + durationMs,
    paused: false,
    fired: false
  });

  renderTimers();

  document.getElementById("timerHours").value = "";
  document.getElementById("timerMinutes").value = "";
  document.getElementById("timerSeconds").value = "";
};

// PAUSE
window.pauseTimer = function (id) {

  const t = timers.find(x => x.id === id);

  if (!t || t.paused) return;

  t.remainingMs = t.end - Date.now();
  t.paused = true;
};

// RESUME
window.resumeTimer = function (id) {

  const t = timers.find(x => x.id === id);

  if (!t || !t.paused) return;

  t.end = Date.now() + t.remainingMs;
  t.paused = false;
};

// RESTART
window.restartTimer = function (id) {

  const t = timers.find(x => x.id === id);

  if (!t) return;

  stopAlarm();

  t.remainingMs = t.durationMs;
  t.end = Date.now() + t.durationMs;
  t.paused = false;
  t.fired = false;
};

// DELETE
window.deleteTimer = function (id) {

  timers = timers.filter(t => t.id !== id);

  if (timers.length === 0) {
    stopAlarm();
  }
};

// RENDER
function renderTimers() {

  const div = document.getElementById("timers");
  div.innerHTML = "";

  timers.forEach(t => {

    let left;

    if (t.paused) {
      left = Math.max(0, Math.floor(t.remainingMs / 1000));
    } else {
      left = Math.max(0, Math.floor((t.end - Date.now()) / 1000));
    }

    // alarm trigger
    if (left === 0 && !t.fired) {
      startAlarm();
      t.fired = true;
    }

    const hrs = Math.floor(left / 3600);
    const mins = Math.floor((left % 3600) / 60);
    const secs = left % 60;

    const format =
      String(hrs).padStart(2, "0") + ":" +
      String(mins).padStart(2, "0") + ":" +
      String(secs).padStart(2, "0");

    const el = document.createElement("div");
    el.className = "timer";

    el.innerHTML = `
      <div>⏳ ${format}</div>

      <div style="margin-top:8px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap;">

        ${
          left === 0
          ? `
            <button class="small-btn" onclick="restartTimer(${t.id})">🔄 Restart</button>
            <button class="small-btn" onclick="stopAlarm(${t.id})">🔕 Stop Alarm</button>
          `
          : `
            ${
              t.paused
              ? `<button class="small-btn" onclick="resumeTimer(${t.id})">▶ Resume</button>`
              : `<button class="small-btn" onclick="pauseTimer(${t.id})">⏸ Pause</button>`
            }

           <button class="small-btn" onclick="restartTimer(${t.id})">🔄 Restart</button>
            <button class="small-btn" onclick="deleteTimer(${t.id})">❌ Delete</button>
          `
        }

      </div>
    `;

    div.appendChild(el);
  });
}

setInterval(renderTimers, 1000);

// ==========================================================
// ==========================================================

// Firebase auth etc (UNCHANGED CORE BELOW)
const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");
const welcomeScreen=document.getElementById("welcomeScreen");
const trackerScreen=document.getElementById("trackerScreen");
const userInfo=document.getElementById("userInfo");

loginBtn.addEventListener("click",()=>{ signInWithPopup(auth,provider); });
logoutBtn.addEventListener("click",()=>{ signOut(auth); });

onAuthStateChanged(auth,async(user)=>{
    if(user){
        currentUser=user;
        welcomeScreen.style.display="none";
        trackerScreen.style.display="block";
        userInfo.textContent="Current User: " + user.displayName;
        await loadHomework();
    }else{
        welcomeScreen.style.display="block";
        trackerScreen.style.display="none";
    }
});

window.checkType=function(){
    let type=document.getElementById("hwType").value;
    document.getElementById("qnaBox").style.display=type==="QnAs"?"block":"none";
}

window.addHomework=async function(){
    const type=document.getElementById("hwType").value;
    const subject=document.getElementById("subject").value;
    const date=document.getElementById("dateInput").value;
    const qna=document.getElementById("qnaBox").value;

    if(!type||!subject||!date){alert("Fill all fields");return;}

    await addDoc(collection(db,"homework"),{
        uid:currentUser.uid,type,subject,date,qna,
        completed:false,createdAt:Date.now()
    });

    await loadHomework();
};

async function loadHomework(){
    const q=query(collection(db,"homework"),where("uid","==",currentUser.uid),orderBy("createdAt","desc"));
    const snap=await getDocs(q);

    homeworkList=[];
    snap.forEach(d=>homeworkList.push({id:d.id,...d.data()}));

    homeworkList.sort((a, b) => {

    const today = new Date();
    today.setHours(0,0,0,0);

    const dateA = new Date(a.date);
    dateA.setHours(0,0,0,0);

    const dateB = new Date(b.date);
    dateB.setHours(0,0,0,0);

    const diffA = Math.ceil((dateA - today) / (1000*60*60*24));
    const diffB = Math.ceil((dateB - today) / (1000*60*60*24));

    return diffA - diffB;
});

renderHomework();
updateProgress();
}

window.deleteHomework=async function(id){
    await deleteDoc(doc(db,"homework",id));
    await loadHomework();
}

window.toggleComplete=async function(id,current){
    await updateDoc(doc(db,"homework",id),{completed:!current});
    await loadHomework();
}

function renderHomework(){
    const list=document.getElementById("homeworkList");
    list.innerHTML="";
    const today=new Date();today.setHours(0,0,0,0);

    homeworkList.forEach(hw=>{
        const div=document.createElement("div");
        const due=new Date(hw.date);due.setHours(0,0,0,0);
        const diff=Math.ceil((due-today)/(1000*60*60*24));

        let c="green";
        if(diff<0)c="red";else if(diff<=2)c="yellow";

        div.className="homework "+c;
       let dueText = "";

if(diff > 0){
    dueText = `Due in ${diff} day${diff > 1 ? "s" : ""}`;
}
else if(diff === 0){
    dueText = "Due today";
}
else{
    dueText = "Overdue";
}

div.innerHTML=`
<div style="display:flex; justify-content:space-between; align-items:center; width:100%; gap:10px;">

    <div>
        <strong>${hw.subject}</strong> - ${hw.type}
        <div style="font-size:13px; color:#666; margin-top:4px;">
            ${dueText}
        </div>
    </div>

    <div style="display:flex; gap:8px;">

        ${
            !hw.completed
            ? `<button class="small-btn" onclick="toggleComplete('${hw.id}', false)">Done</button>`
            : `
                <button class="small-btn" onclick="toggleComplete('${hw.id}', true)">↩ Undo</button>
                <button class="small-btn" onclick="deleteHomework('${hw.id}')">Remove</button>
              `
        }

    </div>

</div>
`;
        list.appendChild(div);
    });
}

function updateProgress(){
    const total=homeworkList.length;
    const done=homeworkList.filter(h=>h.completed).length;
    document.getElementById("progressBar").style.width=(total?done/total*100:0)+"%";
}
</script>

<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
