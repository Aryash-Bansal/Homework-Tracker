<!DOCTYPE html>
<html>
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4CAF50">

<title>Homework Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
}

/* ---- CONTAINER ---- */
#trackerScreen {
    display: none;
    padding: 30px 20px 80px;
    max-width: 700px;
    margin: auto;
}

/* ---- HEADER ---- */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

#userInfo {
    font-size: 14px;
    color: #555;
}

#logoutBtn {
    background: none;
    border: none;
    color: #888;
    cursor: pointer;
    font-size: 14px;
}

/* ---- TITLE ---- */
h1 {
    font-size: 32px;
    margin-bottom: 25px;
    text-align: left;
}

/* ---- FORM ---- */
.form-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

/* labels */
.label {
    font-size: 13px;
    color: #666;
    text-align: left;
    margin-bottom: 4px;
}

input, select {
    padding: 12px;
    font-size: 16px;
    border-radius: 12px;
    border: 1px solid #ddd;
    width: 100%;
    background: white;
    box-sizing: border-box;
}

/* ---- FAB BUTTON ---- */
.plus-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: none;
    font-size: 30px;
    background: #4CAF50;
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
}

/* ---- LIST ---- */
.homework {
    background: white;
    padding: 16px;
    margin-top: 12px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.green { border-left: 6px solid green; }
.yellow { border-left: 6px solid orange; }
.red { border-left: 6px solid red; }

.due-text {
    font-size: 13px;
    margin-top: 5px;
    color: #666;
}

.actions {
    display: flex;
    gap: 8px;
}

.small-btn {
    padding: 5px 10px;
    font-size: 13px;
    cursor: pointer;
}

/* ---- EMPTY STATE ---- */
.empty {
    margin-top: 40px;
    color: #888;
    font-size: 16px;
}

/* ---- PROGRESS ---- */
.progress-container {
    width: 100%;
    background: #ddd;
    margin: 20px 0;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 18px;
    width: 0%;
    background: #4CAF50;
}

/* ---- LOGIN SCREEN (slightly improved) ---- */
#welcomeScreen {
    margin-top: 100px;
    text-align: center;
}

#loginBtn {
    padding: 14px 35px;
    font-size: 18px;
    background: #4285F4;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="welcomeScreen">
    <h1>Homework Tracker</h1>
    <p>All your homework in one place</p>
    <button id="loginBtn">Sign in with Google</button>
</div>

<div id="trackerScreen">

    <div class="header">
        <span id="userInfo"></span>
        <button id="logoutBtn">Logout</button>
    </div>

    <h1>Homework Tracker</h1>

    <div class="form-container">

        <div>
            <div class="label">Category</div>
            <select id="hwType" onchange="checkType()">
                <option value="">Select</option>
                <option>TB Exercises</option>
                <option>QnAs</option>
                <option>Make Notes</option>
                <option>Reading</option>
                <option>Project</option>
            </select>
        </div>

        <div id="qnaWrap" style="display:none;">
            <div class="label">Number of Questions</div>
            <input type="text" id="qnaBox">
        </div>

        <div>
            <div class="label">Subject</div>
            <select id="subject">
                <option value="">Select</option>
                <option>English</option>
                <option>Maths</option>
                <option>Science</option>
            </select>
        </div>

        <div>
            <div class="label">Due Date</div>
            <input type="date" id="dateInput">
        </div>

    </div>

    <button class="plus-btn" onclick="addHomework()">+</button>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="homeworkList"></div>
    <div id="allDone">ALL DONE 🎉</div>

</div>

<script type="module">
/* 🔥 YOUR FIREBASE CODE — UNTOUCHED (same as before) */

/* ONLY CHANGE BELOW */
window.checkType = function(){
    let type=document.getElementById("hwType").value;
    document.getElementById("qnaWrap").style.display =
        type==="QnAs"?"block":"none";
}

/* EMPTY STATE FIX */
function renderHomework(){
    const list=document.getElementById("homeworkList");
    list.innerHTML="";

    if(homeworkList.length===0){
        list.innerHTML='<div class="empty">No homework tasks yet. Add one to get started!</div>';
        return;
    }

    /* rest same as your code */
}
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
