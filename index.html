<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 20px;
}

#welcomeScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 80vh;
}

#loginBtn {
    padding: 12px 28px;
    border-radius: 12px;
    border: none;
    background: #4285F4;
    color: white;
}

#trackerScreen { display: none; }

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#userInfo {
    font-size: 12px;
}

.icon-btn {
    background: #4CAF50;
    border: none;
    color: white;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    cursor: pointer;
}

.form-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
}

input, select {
    width: 90%;
    max-width: 400px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #ddd;
}

.plus-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #4CAF50;
    color: white;
    font-size: 28px;
    border: none;
    cursor: pointer;
}

.homework {
    background: white;
    padding: 15px;
    margin: 10px auto;
    width: 90%;
    max-width: 600px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
}

.strip {
    width: 6px;
    border-radius: 6px;
    margin-right: 10px;
}
</style>
</head>

<body>

<div id="welcomeScreen">
<h1>Homework Tracker</h1>
<button id="loginBtn">Sign in with Google</button>
</div>

<div id="trackerScreen">

<div class="header">
<div id="userInfo"></div>
<button id="logoutBtn" class="icon-btn">⎋</button>
</div>

<h1>Homework Tracker</h1>

<div class="form-container">

<select id="hwType">
<option value="">Type of Homework</option>
<option>TB Exercises</option>
<option>QnAs</option>
<option>Make Notes</option>
<option>Reading</option>
<option>Project</option>
</select>

<select id="subject">
<option value="">Subject</option>
<option>English</option>
<option>History/Civics</option>
<option>Geography</option>
<option>Maths</option>
<option>Computer</option>
<option>Biology</option>
<option>Chemistry</option>
<option>Physics</option>
<option>Hindi</option>
<option>Kannada</option>
<option>French</option>
</select>

<div id="extraField"></div>

<input type="date" id="dateInput">

</div>

<button class="plus-btn" onclick="addHomework()">+</button>

<div id="homeworkList"></div>

</div>

<script type="module">
import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
signOut,
onAuthStateChanged,
setPersistence,
browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
query,
where
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const app = initializeApp({
apiKey:"AIzaSyBvxAsbhzV_XwEkmPTBNSchgapkSU2NFUI",
authDomain:"homework-tracker-global.firebaseapp.com",
projectId:"homework-tracker-global"
});

const auth=getAuth(app);
const db=getFirestore(app);
const provider=new GoogleAuthProvider();

await setPersistence(auth,browserLocalPersistence);

/* LOGIN */
document.getElementById("loginBtn").onclick=()=>signInWithPopup(auth,provider);
document.getElementById("logoutBtn").onclick=()=>signOut(auth);

let hwData=[];

/* SUBJECT LOGIC FIX (NO DUPLICATES) */
document.getElementById("subject").onchange=()=>{
const v=subject.value;
const box=document.getElementById("extraField");
box.innerHTML="";

if(v==="QnAs"){
box.innerHTML=`<input id="qCount" placeholder="Number of questions">`;
}

if(v==="Maths"){
box.innerHTML=`<input id="mCount" placeholder="Number of exercises">`;
}
};

window.addHomework=async()=>{
const u=auth.currentUser;
if(!u)return;

if(!hwType.value || !subject.value || !dateInput.value){
alert("Fill all fields");
return;
}

await addDoc(collection(db,"homework"),{
uid:u.uid,
type:hwType.value,
subject:subject.value,
date:dateInput.value,
done:false,
createdAt:Date.now()
});

load();
};

function color(days){
if(days<0)return"red";
if(days<=2)return"yellow";
return"green";
}

async function load(){
const u=auth.currentUser;
if(!u)return;

const q=query(collection(db,"homework"),where("uid","==",u.uid));
const snap=await getDocs(q);

hwData=[];
snap.forEach(d=>hwData.push({id:d.id,...d.data()}));

render();
}

function render(){
const list=document.getElementById("homeworkList");
list.innerHTML="";

hwData.sort((a,b)=>a.done-b.done);

hwData.forEach(h=>{
const days=Math.ceil((new Date(h.date)-new Date())/86400000);

const div=document.createElement("div");
div.className="homework"+(h.done?" done":"");

div.innerHTML=`
<div class="strip" style="background:${color(days)}"></div>

<div>
<b>${h.subject} - ${h.type}</b><br>
<small>${days>=0?days+" days left":"Overdue"}</small>
</div>

<div>
<button onclick="mark('${h.id}')">Done</button>
</div>
`;

list.appendChild(div);
});
}

window.mark=(id)=>{
const h=hwData.find(x=>x.id===id);
if(h)h.done=true;
render();
};

onAuthStateChanged(auth,u=>{
if(u){
welcomeScreen.style.display="none";
trackerScreen.style.display="block";
userInfo.textContent="Currently signed in as "+u.displayName;
load();
}
});
</script>

</body>
</html>
