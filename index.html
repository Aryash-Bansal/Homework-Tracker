<!DOCTYPE html>
<html>
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4CAF50">

<title>Homework Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 0;
}

/* CENTER CONTAINER */
.container {
    max-width: 700px;
    margin: auto;
    padding: 30px 20px;
}

/* WELCOME */
#welcomeScreen {
    text-align: center;
    margin-top: 80px;
}

#welcomeScreen h1 {
    font-size: 42px;
    margin-bottom: 10px;
}

#loginBtn {
    padding: 14px 30px;
    font-size: 18px;
    background: #4285F4;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

#logoutBtn {
    background: none;
    border: none;
    color: #666;
    cursor: pointer;
}

/* TITLE */
.main-title {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 25px;
}

/* FORM */
.form-group {
    margin-bottom: 15px;
    text-align: left;
}

label {
    font-size: 13px;
    color: #555;
    margin-bottom: 5px;
    display: block;
}

input, select {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #ddd;
    background: white;
    font-size: 16px;
}

/* ADD BUTTON */
.add-btn {
    width: 100%;
    margin-top: 10px;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: #4CAF50;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

/* LIST */
.homework {
    background: white;
    padding: 14px;
    margin-top: 10px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
}

.green { border-left: 5px solid green; }
.yellow { border-left: 5px solid orange; }
.red { border-left: 5px solid red; }

.due-text {
    font-size: 13px;
    color: #666;
}

/* EMPTY STATE */
.empty {
    margin-top: 30px;
    color: #888;
}

/* PROGRESS */
.progress-container {
    background: #ddd;
    border-radius: 20px;
    margin-top: 20px;
}

.progress-bar {
    height: 20px;
    width: 0%;
    background: #4CAF50;
    border-radius: 20px;
}
</style>
</head>

<body>

<div id="welcomeScreen">
    <h1>Homework Tracker</h1>
    <button id="loginBtn">Sign in with Google</button>
</div>

<div id="trackerScreen" style="display:none;">
    <div class="container">

        <div class="header">
            <span id="userInfo"></span>
            <button id="logoutBtn">Logout</button>
        </div>

        <div class="main-title">Homework Tracker</div>

        <!-- FORM -->
        <div class="form-group">
            <label>Category</label>
            <select id="hwType" onchange="checkType()">
                <option value="">Select</option>
                <option>TB Exercises</option>
                <option>QnAs</option>
                <option>Make Notes</option>
                <option>Reading</option>
                <option>Project</option>
            </select>
        </div>

        <div class="form-group" id="qnaWrap" style="display:none;">
            <label>Number of Questions</label>
            <input id="qnaBox">
        </div>

        <div class="form-group">
            <label>Subject</label>
            <select id="subject">
                <option value="">Select</option>
                <option>Maths</option>
                <option>Science</option>
                <option>English</option>
            </select>
        </div>

        <div class="form-group">
            <label>Due Date</label>
            <input type="date" id="dateInput">
        </div>

        <button class="add-btn" onclick="addHomework()">Add Task</button>

        <!-- PROGRESS -->
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- LIST -->
        <div id="homeworkList"></div>
        <div id="emptyState" class="empty">No homework yet</div>

    </div>
</div>

<!-- FIREBASE (UNCHANGED LOGIC) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, query, where, orderBy }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = { /* YOUR SAME CONFIG */ };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser=null;
let homeworkList=[];

loginBtn.onclick=()=>signInWithPopup(auth,provider);
logoutBtn.onclick=()=>signOut(auth);

onAuthStateChanged(auth, async (user)=>{
    if(user){
        currentUser=user;
        welcomeScreen.style.display="none";
        trackerScreen.style.display="block";
        userInfo.textContent=user.displayName;
        await loadHomework();
    } else {
        welcomeScreen.style.display="block";
        trackerScreen.style.display="none";
    }
});

window.checkType=()=>{
    qnaWrap.style.display = hwType.value==="QnAs"?"block":"none";
}

window.addHomework=async ()=>{
    if(!hwType.value||!subject.value||!dateInput.value){
        alert("Fill all fields");
        return;
    }

    await addDoc(collection(db,"homework"),{
        uid:currentUser.uid,
        type:hwType.value,
        subject:subject.value,
        date:dateInput.value,
        qna:qnaBox.value,
        completed:false,
        createdAt:Date.now()
    });

    await loadHomework();
}

async function loadHomework(){
    const q=query(
        collection(db,"homework"),
        where("uid","==",currentUser.uid),
        orderBy("createdAt","desc")
    );

    const snap=await getDocs(q);
    homeworkList=[];
    snap.forEach(d=>homeworkList.push({id:d.id,...d.data()}));

    renderHomework();
    updateProgress();
}

function renderHomework(){
    homeworkListDiv.innerHTML="";
    emptyState.style.display = homeworkList.length ? "none":"block";

    homeworkList.forEach(hw=>{
        const div=document.createElement("div");

        div.className="homework";

        div.innerHTML=`
        <div>
            <b>${hw.subject}</b> - ${hw.type}
            <div class="due-text">${hw.date}</div>
        </div>
        <div>
            <button onclick="toggleComplete('${hw.id}',${hw.completed})">✔</button>
            <button onclick="deleteHomework('${hw.id}')">❌</button>
        </div>
        `;

        homeworkListDiv.appendChild(div);
    });
}

window.deleteHomework=async id=>{
    await deleteDoc(doc(db,"homework",id));
    loadHomework();
}

window.toggleComplete=async(id,c)=>{
    await updateDoc(doc(db,"homework",id),{completed:!c});
    loadHomework();
}

function updateProgress(){
    const done=homeworkList.filter(h=>h.completed).length;
    progressBar.style.width = (done/homeworkList.length*100||0)+"%";
}
</script>

</body>
</html>
