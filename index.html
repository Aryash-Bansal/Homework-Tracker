<!DOCTYPE html>
<html>
<head>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4CAF50">

<title>Homework Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 20px;
    text-align: center;
}

#trackerScreen { display: none; }

h1 { margin: 15px 0; }

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* FORM */
.form-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
}

input, select {
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #ddd;
    width: 90%;
    max-width: 400px;
    background: white;
}

/* FAB */
.plus-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #4CAF50;
    color: white;
    font-size: 28px;
    border: none;
}

/* CARD */
.homework {
    background: white;
    padding: 15px;
    margin: 10px auto;
    width: 90%;
    max-width: 600px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.completed { opacity: 0.5; }

/* PROGRESS */
.progress-container {
    width: 90%;
    max-width: 600px;
    margin: 20px auto;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 18px;
    width: 0%;
    background: #4CAF50;
}

.progress-text {
    margin-top: 8px;
    font-size: 14px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="welcomeScreen">
    <h1>Welcome to Homework Tracker</h1>
    <button id="loginBtn">Sign in with Google</button>
</div>

<!-- APP -->
<div id="trackerScreen">

<div class="header">
<span id="userInfo"></span>
<button id="logoutBtn">Logout</button>
</div>

<h1>Homework Tracker</h1>

<div class="form-container">

<select id="hwType">
<option value="">Type of Homework</option>
<option>TB Exercises</option>
<option>QnAs</option>
<option>Make Notes</option>
<option>Reading</option>
<option>Project</option>
</select>

<select id="subject">
<option value="">Subject</option>
<option>English</option>
<option>History/Civics</option>
<option>Geography</option>
<option>Maths</option>
<option>Computer</option>
<option>Biology</option>
<option>Chemistry</option>
<option>Physics</option>
<option>Hindi</option>
<option>Kannada</option>
<option>French</option>
</select>

<input type="date" id="dateInput" onclick="this.showPicker()">

</div>

<button class="plus-btn" onclick="addHomework()">+</button>

<div class="progress-container">
<div class="progress-bar" id="progressBar"></div>
</div>
<div class="progress-text" id="progressText"></div>

<div id="homeworkList"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithRedirect,
  getRedirectResult,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  updateDoc,
  doc,
  query,
  where,
  orderBy
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "homework-tracker-global.firebaseapp.com",
  projectId: "homework-tracker-global"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser=null;
let homeworkList=[];

/* LOGIN FIX (ROBUST) */
document.getElementById("loginBtn").onclick = async () => {
    try {
        await signInWithPopup(auth, provider);
    } catch (e) {
        await signInWithRedirect(auth, provider);
    }
};

/* HANDLE REDIRECT FIRST */
getRedirectResult(auth).catch(()=>{});

/* AUTH STATE */
onAuthStateChanged(auth, async user=>{
    if(user){
        currentUser=user;
        welcomeScreen.style.display="none";
        trackerScreen.style.display="block";
        userInfo.textContent="Logged in as: "+user.displayName;
        loadHomework();
    } else {
        welcomeScreen.style.display="block";
        trackerScreen.style.display="none";
    }
});

/* LOGOUT */
logoutBtn.onclick = ()=> signOut(auth);

/* ADD */
window.addHomework = async ()=>{
    if(!hwType.value||!subject.value||!dateInput.value) return;

    await addDoc(collection(db,"homework"),{
        uid: currentUser.uid,
        type: hwType.value,
        subject: subject.value,
        date: dateInput.value,
        completed:false,
        createdAt: Date.now()
    });

    hwType.value="";
    subject.value="";
    dateInput.value="";
    loadHomework();
};

/* LOAD */
async function loadHomework(){
    const q = query(
        collection(db,"homework"),
        where("uid","==",currentUser.uid),
        orderBy("createdAt","desc")
    );

    const snap = await getDocs(q);
    homeworkList=[];
    snap.forEach(d=>homeworkList.push({id:d.id,...d.data()}));

    renderHomework();
}

/* COMPLETE */
window.completeWithPop = async (btn,id)=>{
    btn.style.display="none";
    await updateDoc(doc(db,"homework",id),{completed:true});
    loadHomework();
};

/* DELETE */
window.deleteHomework = async id=>{
    await deleteDoc(doc(db,"homework",id));
    loadHomework();
};

/* RENDER */
function renderHomework(){
    const list=document.getElementById("homeworkList");
    list.innerHTML="";

    homeworkList.sort((a,b)=>a.completed - b.completed);

    homeworkList.forEach(hw=>{
        const div=document.createElement("div");
        div.className=`homework ${hw.completed?"completed":""}`;

        div.innerHTML=`
        <div><strong>${hw.subject}</strong> - ${hw.type}</div>
        <div>
            ${
                hw.completed
                ? `<button onclick="deleteHomework('${hw.id}')">❌</button>`
                : `<button onclick="completeWithPop(this,'${hw.id}')">Done</button>`
            }
        </div>
        `;
        list.appendChild(div);
    });

    updateProgress();
}

/* PROGRESS */
function updateProgress(){
    const total=homeworkList.length;
    const done=homeworkList.filter(h=>h.completed).length;

    const percent= total===0?0:Math.round((done/total)*100);
    progressBar.style.width=percent+"%";

    if(total===0){
        progressText.innerText="Add HW to see completion";
    } else if(done===0){
        progressText.innerText="Click done to progress";
    } else {
        progressText.innerText=percent+"% complete";
    }

    if(total>0 && done===total){
        progressText.innerText="ALL DONE 🎉";
        confetti({ particleCount:150, spread:70 });
    }
}
</script>

</body>
</html>
